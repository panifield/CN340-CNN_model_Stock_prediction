[pytest]
# รันจาก root ของ repo:  PYTHONDONTWRITEBYTECODE=1 python -m pytest task_b_v2/mode1600/tests
# ไฟล์นี้ทำให้ rootdir = mode1600/ (ไม่ใช้ pytest.ini ของ task_b_v2 และไม่เก็บ test ของ task_b_v2/tests)
# pythonpath = .. → task_b_v2/ อยู่ใน sys.path → `import mode1600.data1600` และ `import src.data` (อ่านอย่างเดียว) ได้
# no:cacheprovider → ไม่เขียน .pytest_cache ลงที่ใด
pythonpath = ..
testpaths = tests
addopts = -p no:cacheprovider
